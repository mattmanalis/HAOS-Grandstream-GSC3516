dial:
  name: Dial
  description: Trigger a call to an extension, ring group, or number.
  fields:
    entity_id:
      required: false
      example: "media_player.grandstream_gsc3516_speaker"
      selector:
        entity:
          domain: media_player
          integration: grandstream_gsc3516
    entry_id:
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
    number:
      required: false
      example: "6001"
      selector:
        text:

hangup:
  name: Hangup
  description: End the active call on the configured device.
  fields:
    entity_id:
      required: false
      example: "media_player.grandstream_gsc3516_speaker"
      selector:
        entity:
          domain: media_player
          integration: grandstream_gsc3516
    entry_id:
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
